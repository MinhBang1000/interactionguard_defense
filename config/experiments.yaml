    model: meta-llama/Llama-3.1-8B-Instruct
    revision: 0e9e39f249a16976918f6564b8830bc894c89659
    dtype: bfloat16
    temperature: 0.0
    seed: 42
    threshold: 0.5
    max_tokens: 512
    max_model_len: 8192
    max_num_seqs: 8
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.88
    batch_size: 64
    max_retries: 2
